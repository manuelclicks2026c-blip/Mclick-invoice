<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087eaa"><meta name="description" content="Manuelclicks Invoice — invoices, bookings and receipts for Manuelclicks Photography"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Manuelclicks Invoice</title>
<style>
:root{--blue:#087eaa;--blue2:#075477;--ink:#17212b;--muted:#697681;--line:#e3e9ed;--bg:#f4f7f9;--white:#fff;--soft:#eaf6fb;--red:#b42318;--green:#147d50;--gold:#f2b544;--shadow:0 8px 28px #102a3a0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:4}.brand{padding:4px 10px 22px;border-bottom:1px solid var(--line);margin-bottom:15px}.brand img{width:100%;height:78px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;border-radius:10px;padding:12px 13px;color:#52616d;font-weight:600;display:flex;align-items:center;gap:12px}.nav button span{width:22px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:var(--soft);color:var(--blue2)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:12px}.main{margin-left:250px;min-height:100vh}.topbar{height:72px;background:#ffffffde;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.topbar h1{font-size:20px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.content{padding:28px;max-width:1500px;margin:auto}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.danger{color:var(--red);border-color:#f3c7c3}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.pagehead h2{font-size:25px;margin:0}.pagehead p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.stat,.panel,.card{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:19px}.stat .label{font-size:12px;color:var(--muted);font-weight:650}.stat .num{font-size:27px;font-weight:750;margin:7px 0 2px;letter-spacing:-.5px}.stat .hint{font-size:12px;color:var(--muted)}.stat .ico{float:right;background:var(--soft);color:var(--blue);width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}.dashgrid{grid-template-columns:1.25fr 1fr}.panel{padding:20px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panelhead h3{margin:0;font-size:16px}.muted{color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{min-height:76px;justify-content:flex-start;padding:14px}.quick .qicon{font-size:20px;background:var(--soft);color:var(--blue);width:36px;height:36px;display:grid;place-items:center;border-radius:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);background:#f8fafb;padding:12px 14px;font-weight:750}.table td{padding:13px 14px;border-top:1px solid #edf0f2;font-size:13px;vertical-align:middle}.table tr:hover td{background:#fbfdfe}.right{text-align:right}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:750;background:#edf1f4;color:#52616d;text-transform:capitalize}.badge.paid{background:#e4f6ed;color:#137448}.badge.unpaid,.badge.cancelled{background:#fdebea;color:#a52a23}.badge.partially-paid{background:#fff4d8;color:#8b6200}.badge.draft{background:#edf1f4}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{max-width:260px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;color:#53616c;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #d8e0e5;background:#fff;border-radius:8px;padding:10px 11px;outline:none;color:var(--ink);min-width:0}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #087eaa1a}.field textarea{resize:vertical;min-height:78px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field.full{grid-column:1/-1}.sectiontitle{font-size:14px;font-weight:800;margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:42px 16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.overlay{position:fixed;inset:0;background:#0d202e75;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding:24px;overflow:auto}.modal{background:white;border-radius:16px;width:min(900px,100%);margin:auto;box-shadow:0 24px 90px #071b2a40;overflow:hidden}.modalhead{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1}.modalhead h2{font-size:19px;margin:0}.modalbody{padding:22px}.modalfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fbfcfd}.xbtn{border:0;background:#f0f4f6;border-radius:8px;width:34px;height:34px;font-size:20px}.lineitem,.programme,.paymentbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fcfdfe}.linehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.linehead strong{font-size:13px}.itemgrid{display:grid;grid-template-columns:1.2fr 1.4fr .55fr .8fr .8fr auto;gap:9px;align-items:end}.totals{margin-left:auto;width:min(340px,100%);display:grid;gap:8px;padding:15px;background:#f7fafb;border-radius:10px}.totalrow{display:flex;justify-content:space-between;gap:15px;font-size:13px}.totalrow.final{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:9px}.eventgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.notice{padding:12px 14px;border-radius:9px;background:#fff7df;color:#775500;font-size:12px;margin-bottom:15px}.success{background:#e4f6ed;color:#137448}.settinglogo{max-width:260px;max-height:85px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:6px}.hidden{display:none!important}.mobilebrand{display:none}.footnote{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}.actions{display:flex;gap:6px;flex-wrap:wrap}.eventprint{padding:10px 0;border-bottom:1px solid #ddd}.eventprint:last-child{border:0}.eventprint h4{margin:0 0 5px}.eventprint p{margin:3px 0;font-size:12px}.receiptstamp{font-size:12px;color:var(--green);font-weight:800;letter-spacing:1px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashgrid{grid-template-columns:1fr}.itemgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.itemgrid .field:last-child{grid-column:auto}.sidebar{width:215px}.main{margin-left:215px}.content{padding:20px}}
@media(max-width:700px){.sidebar{position:fixed;inset:auto 0 0;width:100%;height:68px;padding:5px 7px;border-right:0;border-top:1px solid var(--line);box-shadow:0 -5px 20px #102a3a0b}.brand,.sidefoot{display:none}.nav{display:flex;justify-content:space-around;gap:0;height:100%}.nav button{flex:1;flex-direction:column;gap:2px;padding:5px 1px;font-size:10px;border-radius:8px}.nav button span{font-size:18px}.main{margin-left:0;padding-bottom:76px}.topbar{height:62px;padding:0 16px}.topbar h1{font-size:17px}.topbar p{display:none}.top-actions .btn:not(.primary){display:none}.content{padding:17px 13px}.pagehead{align-items:flex-start}.pagehead h2{font-size:22px}.pagehead p{font-size:12px}.stats{gap:10px}.stat{padding:13px}.stat .num{font-size:21px}.stat .ico{width:30px;height:30px;font-size:15px}.stat .hint{font-size:10px}.panel{padding:14px}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick button{font-size:12px;padding:10px;gap:7px}.quick .qicon{width:30px;height:30px}.formgrid,.eventgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.overlay{padding:8px}.modal{border-radius:12px}.modalhead,.modalbody{padding:16px}.modalfoot{padding:12px 16px}.itemgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.itemgrid .field:first-child,.itemgrid .field:nth-child(2){grid-column:span 2}.itemgrid .btn{align-self:end}.toolbar input,.toolbar select{max-width:none;flex:1;min-width:135px}.pagehead .btn{padding:9px 10px;font-size:12px}.table{min-width:650px}}
@media print{body{background:white}.sidebar,.topbar,.content,.overlay{display:none!important}#printRoot{display:block!important}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="logo.jpg" alt="Manuelclicks Photography logo"><small>Invoice & booking manager</small></div><nav class="nav" id="nav"><button data-page="dashboard" class="active"><span>▦</span>Dashboard</button><button data-page="invoices"><span>▤</span>Invoices</button><button data-page="clients"><span>♙</span>Clients</button><button data-page="packages"><span>▣</span>Packages</button><button data-page="payments"><span>↗</span>Payments</button><button data-page="settings"><span>⚙</span>Settings</button></nav><div class="sidefoot">Manuelclicks Invoice<br>Local-first • Ghana</div></aside><main class="main"><header class="topbar"><div><h1 id="topTitle">Dashboard</h1><p>Manuelclicks Photography · Your business at a glance</p></div><div class="top-actions"><button class="btn" onclick="exportBackup()">⇩ Backup</button><button class="btn primary" onclick="openInvoice()">＋ New invoice</button></div></header><section class="content" id="view"></section></main></div><div id="modalRoot"></div><div id="printRoot" class="hidden"></div>
<script>
(()=>{'use strict';const KEY='manuelclicks_invoice_v1';const $=s=>document.querySelector(s);const money=n=>`${settings().currency||'GH₵'} ${Number(n||0).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2})}`;const uid=p=>p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();const today=()=>new Date().toISOString().slice(0,10);let page='dashboard',search='',filter='all';
const defaults={version:1,clients:[],packages:[],invoices:[],payments:[],settings:{businessName:'Manuelclicks Photography',email:'manuelclicksphotography@gmail.com',instagram:'https://www.instagram.com/manuelclicks',phone:'',address:'',currency:'GH₵',depositPercent:60,terms:'A 60% deposit is required to confirm the booking. Balance is due on or before the event date.',notes:'Thank you for choosing Manuelclicks Photography.',invoicePrefix:'MC-INV',receiptPrefix:'MC-RCT',invoiceNext:1001,receiptNext:1001,logo:'logo.jpg'}};
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return structuredClone(defaults);const d=JSON.parse(raw);return {...structuredClone(defaults),...d,settings:{...defaults.settings,...(d.settings||{})},clients:d.clients||[],packages:d.packages||[],invoices:d.invoices||[],payments:d.payments||[]}}catch(e){alert('Your saved data could not be read. Please do not clear browser data. If you have a JSON backup, restore it from Settings.');return structuredClone(defaults)}}let db=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save. Your browser storage may be full. Export a backup and remove large logo images if needed.');return false}}function settings(){return db.settings}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(inv){if(inv.status==='cancelled'||inv.status==='draft')return inv.status;const total=grand(inv),paid=paidFor(inv.id);return paid<=0?'unpaid':paid+0.005>=total?'paid':'partially paid'}function subtotal(inv){return (inv.items||[]).reduce((s,i)=>s+Math.max(0,Number(i.qty)||0)*Math.max(0,Number(i.price)||0),0)}function grand(inv){return Math.max(0,subtotal(inv)-(Number(inv.discount)||0)+(Number(inv.charges)||0))}function paidFor(id){return db.payments.filter(p=>p.invoiceId===id&&!p.reversed).reduce((s,p)=>s+Number(p.amount||0),0)}function balance(inv){return Math.max(0,grand(inv)-paidFor(inv.id))}function client(id){return db.clients.find(c=>c.id===id)||{name:'Deleted client'}}function invLabel(inv){return inv.number||inv.id}function fmtDate(d){if(!d)return '';let x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}function numberInvoice(){return `${settings().invoicePrefix}-${String(settings().invoiceNext++).padStart(4,'0')}`}function numberReceipt(){return `${settings().receiptPrefix}-${String(settings().receiptNext++).padStart(4,'0')}`}
function go(p){page=p;search='';$('#topTitle').textContent=({dashboard:'Dashboard',invoices:'Invoices',clients:'Clients',packages:'Packages',payments:'Payments',settings:'Settings'})[p]||p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function empty(title,desc,button=''){return `<div class="empty"><strong>${title}</strong>${desc}${button?`<div style="margin-top:15px">${button}</div>`:''}</div>`}function pageHead(title,desc,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function badge(s){return `<span class="badge ${esc((s||'').replaceAll(' ','-'))}">${esc(s||'—')}</span>`}function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function render(){const v=$('#view');if(page==='dashboard')v.innerHTML=dashboard();if(page==='clients')v.innerHTML=clientsPage();if(page==='packages')v.innerHTML=packagesPage();if(page==='invoices')v.innerHTML=invoicesPage();if(page==='payments')v.innerHTML=paymentsPage();if(page==='settings')v.innerHTML=settingsPage()}
function dashboard(){const outstanding=db.invoices.filter(i=>!['draft','cancelled'].includes(status(i))).reduce((s,i)=>s+balance(i),0),received=db.payments.filter(p=>!p.reversed).reduce((s,p)=>s+Number(p.amount||0),0),upcoming=db.invoices.filter(i=>(i.programmes||[]).some(e=>e.date&&e.date>=today())&&!['cancelled','draft'].includes(i.status)).sort((a,b)=>String(a.programmes?.[0]?.date||'').localeCompare(String(b.programmes?.[0]?.date||''))).slice(0,5);let rows=db.invoices.slice().reverse().slice(0,5).map(i=>`<tr><td><strong>${esc(invLabel(i))}</strong><br><span class="muted">${esc(client(i.clientId).name)}</span></td><td>${fmtDate(i.date)}</td><td>${money(grand(i))}</td><td>${badge(status(i))}</td><td>${btn('View','editInvoice(\''+i.id+'\')','small')}</td></tr>`).join('');return `${pageHead('Welcome back','Here is your photography business overview.',btn('＋ Create invoice','openInvoice()','primary'))}<div class="grid stats"><div class="stat"><span class="ico">♙</span><div class="label">TOTAL CLIENTS</div><div class="num">${db.clients.length}</div><div class="hint">Saved client records</div></div><div class="stat"><span class="ico">▤</span><div class="label">TOTAL INVOICES</div><div class="num">${db.invoices.length}</div><div class="hint">${db.invoices.filter(i=>status(i)==='paid').length} fully paid</div></div><div class="stat"><span class="ico">◷</span><div class="label">OUTSTANDING BALANCE</div><div class="num" style="font-size:clamp(17px,2.3vw,26px)">${money(outstanding)}</div><div class="hint">Amount yet to be collected</div></div><div class="stat"><span class="ico">↗</span><div class="label">PAYMENTS RECEIVED</div><div class="num" style="font-size:clamp(17px,2.3vw,26px)">${money(received)}</div><div class="hint">Recorded payments to date</div></div></div><div class="grid dashgrid"><section class="panel"><div class="panelhead"><h3>Recent invoices</h3>${btn('All invoices','go(\'invoices\')','small')}</div>${rows?table(['Invoice / Client','Date','Total','Status',''],rows):empty('No invoices yet','Create your first invoice to get started.',btn('Create invoice','openInvoice()','primary'))}</section><section class="panel"><div class="panelhead"><h3>Quick actions</h3></div><div class="quick"><button class="btn" onclick="openInvoice()"><span class="qicon">＋</span><span>Create invoice</span></button><button class="btn" onclick="openClient()"><span class="qicon">♙</span><span>Add a client</span></button><button class="btn" onclick="openPayment()"><span class="qicon">↗</span><span>Record payment</span></button><button class="btn" onclick="go('payments')"><span class="qicon">▧</span><span>Issue receipt</span></button></div><div class="sectiontitle">Upcoming bookings</div>${upcoming.length?upcoming.map(i=>{const e=(i.programmes||[]).find(x=>x.date&&x.date>=today());return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><strong>${esc(e?.name||i.eventName||'Booking')}</strong><div class="muted" style="font-size:12px">${esc(client(i.clientId).name)} · ${esc(e?.date||'Date not set')}</div><div class="muted" style="font-size:12px">${esc(e?.location||'Location not set')}</div></div>`}).join(''):'<p class="muted" style="font-size:13px">No upcoming bookings with future dates.</p>'}</section></div><p class="footnote">Your records are stored in this browser on this device. Export a JSON backup regularly, and before changing devices or updating the app.</p>`}
function clientsPage(){let arr=db.clients.filter(c=>(c.name+' '+c.phone+' '+c.email+' '+c.event).toLowerCase().includes(search.toLowerCase()));return `${pageHead('Clients','Keep client contacts and booking notes in one place.',btn('＋ Add client','openClient()','primary'))}<div class="toolbar"><input placeholder="Search name, phone, email…" value="${esc(search)}" oninput="search=this.value;render()"></div>${arr.length?table(['Client','Phone','Email','Event / booking','Invoices','Actions'],arr.map(c=>`<tr><td><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.address||'')}</span></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.event||'—')}</td><td>${db.invoices.filter(i=>i.clientId===c.id).length}</td><td><div class="actions">${btn('Edit',`openClient('${c.id}')`,'small')}${btn('Delete',`deleteClient('${c.id}')`,'small danger')}</div></td></tr>`).join('')):empty('No clients found','Add a client, or try another search.',btn('Add client','openClient()','primary'))}`}
function packagesPage(){let arr=db.packages.filter(p=>(p.name+' '+p.description).toLowerCase().includes(search.toLowerCase()));return `${pageHead('Photography packages','Reusable packages for your common services.',btn('＋ Add package','openPackage()','primary'))}<div class="toolbar"><input placeholder="Search packages…" value="${esc(search)}" oninput="search=this.value;render()"></div>${arr.length?table(['Package','Description / deliverables','Price','Duration','Actions'],arr.map(p=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.description||'—')}</td><td>${money(p.price)}</td><td>${esc(p.duration||'—')}</td><td><div class="actions">${btn('Edit',`openPackage('${p.id}')`,'small')}${btn('Delete',`deletePackage('${p.id}')`,'small danger')}</div></td></tr>`).join('')):empty('No packages saved','Save packages to add them quickly to invoices.',btn('Add package','openPackage()','primary'))}`}
function invoicesPage(){let arr=db.invoices.filter(i=>{const s=status(i);return (i.number+' '+client(i.clientId).name+' '+(i.eventName||'')).toLowerCase().includes(search.toLowerCase())&&(filter==='all'||s===filter)}).slice().reverse();return `${pageHead('Invoices','Create invoices, manage bookings and track balances.',btn('＋ New invoice','openInvoice()','primary'))}<div class="toolbar"><input placeholder="Search invoice, client or event…" value="${esc(search)}" oninput="search=this.value;render()"><select onchange="filter=this.value;render()"><option value="all">All statuses</option>${['draft','unpaid','partially paid','paid','cancelled'].map(s=>`<option ${filter===s?'selected':''} value="${s}">${s}</option>`).join('')}</select><button class="btn" onclick="exportCSV()">⇩ Export CSV</button></div>${arr.length?table(['Invoice','Client / event','Issue date','Total','Paid','Balance','Status','Actions'],arr.map(i=>`<tr><td><strong>${esc(invLabel(i))}</strong></td><td>${esc(client(i.clientId).name)}<br><span class="muted">${esc(i.eventName||'')}</span></td><td>${fmtDate(i.date)}</td><td>${money(grand(i))}</td><td>${money(paidFor(i.id))}</td><td>${money(balance(i))}</td><td>${badge(status(i))}</td><td><div class="actions">${btn('Edit',`editInvoice('${i.id}')`,'small')}${btn('Print',`printInvoice('${i.id}')`,'small')}${btn('Pay',`openPayment('${i.id}')`,'small')}${btn('Delete',`deleteInvoice('${i.id}')`,'small danger')}</div></td></tr>`).join('')):empty('No invoices match','Create an invoice or change your search.',btn('New invoice','openInvoice()','primary'))}`}
function paymentsPage(){let arr=db.payments.filter(p=>!p.reversed&&(p.reference+' '+client(p.clientId).name+' '+(p.method||'')).toLowerCase().includes(search.toLowerCase())).slice().reverse();return `${pageHead('Payments & receipts','Record instalments and print a receipt for each payment.',btn('＋ Record payment','openPayment()','primary'))}<div class="toolbar"><input placeholder="Search receipt, client, method…" value="${esc(search)}" oninput="search=this.value;render()"></div>${arr.length?table(['Receipt','Invoice','Client','Date','Method','Amount','Actions'],arr.map(p=>`<tr><td><strong>${esc(p.receiptNo||'—')}</strong></td><td>${esc(db.invoices.find(i=>i.id===p.invoiceId)?.number||'Invoice unavailable')}</td><td>${esc(client(p.clientId).name)}</td><td>${fmtDate(p.date)}</td><td>${esc(p.method||'—')}</td><td>${money(p.amount)}</td><td><div class="actions">${btn('Print receipt',`printReceipt('${p.id}')`,'small')}${btn('Reverse',`reversePayment('${p.id}')`,'small danger')}</div></td></tr>`).join('')):empty('No payments recorded','Once a client pays, record the transaction to issue a receipt.',btn('Record payment','openPayment()','primary'))}<p class="footnote">Reversing a payment marks it reversed instead of deleting its history. Print a receipt only for a recorded, non-reversed payment.</p>`}
function settingsPage(){const s=settings();return `${pageHead('Business settings','Set the details shown on invoices and receipts.') }<div class="panel"><form id="settingsForm"><div class="formgrid"><div class="field"><label>Business name</label><input name="businessName" required value="${esc(s.businessName)}"></div><div class="field"><label>Business email</label><input name="email" type="email" value="${esc(s.email)}"></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(s.phone)}" placeholder="Enter your business phone"></div><div class="field"><label>Instagram link</label><input name="instagram" value="${esc(s.instagram)}"></div><div class="field full"><label>Business address (optional)</label><textarea name="address">${esc(s.address)}</textarea></div><div class="field"><label>Currency symbol / label</label><input name="currency" value="${esc(s.currency)}" required></div><div class="field"><label>Default deposit percentage</label><input name="depositPercent" type="number" min="0" max="100" value="${Number(s.depositPercent)}"></div><div class="field"><label>Invoice prefix</label><input name="invoicePrefix" value="${esc(s.invoicePrefix)}"></div><div class="field"><label>Next invoice number</label><input name="invoiceNext" type="number" min="1" value="${Number(s.invoiceNext)}"></div><div class="field"><label>Receipt prefix</label><input name="receiptPrefix" value="${esc(s.receiptPrefix)}"></div><div class="field"><label>Next receipt number</label><input name="receiptNext" type="number" min="1" value="${Number(s.receiptNext)}"></div><div class="field full"><label>Default payment terms</label><textarea name="terms">${esc(s.terms)}</textarea></div><div class="field full"><label>Default invoice notes</label><textarea name="notes">${esc(s.notes)}</textarea></div><div class="field full"><label>Business logo</label><img class="settinglogo" src="${esc(s.logo||'logo.jpg')}" alt="Business logo"><input type="file" id="logoUpload" accept="image/png,image/jpeg,image/webp" style="margin-top:8px"><small class="muted">Use a PNG or JPG. Logo image is stored in this browser. Large images may use more storage.</small></div></div><div style="margin-top:18px">${btn('Save settings',"document.getElementById('settingsForm').requestSubmit()",'primary')} <button type="button" class="btn" onclick="exportBackup()">Export JSON backup</button> <button type="button" class="btn" onclick="document.getElementById('restoreFile').click()">Restore backup</button> <button type="button" class="btn" onclick="exportCSV()">Export invoices CSV</button><input type="file" id="restoreFile" accept="application/json,.json" class="hidden"></div></form></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">Data safety</h3><p class="muted">All business records are saved in this browser on this device. They are not synced between devices. Clearing website data, removing browser storage, or losing the device can erase your records. Export a JSON backup regularly and before replacing app files.</p><button class="btn danger" onclick="clearAll()">Clear all app data…</button></div>`}
function modal(title,body,saveLabel='Save'){ $('#modalRoot').innerHTML=`<div class="overlay" id="overlay" onclick="if(event.target.id==='overlay')closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="xbtn" onclick="closeModal()">×</button></div><div class="modalbody">${body}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="modalSave">${saveLabel}</button></div></div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function openClient(id){const c=db.clients.find(x=>x.id===id)||{name:'',phone:'',email:'',address:'',event:'',notes:''};modal(id?'Edit client':'Add client',`<form id="clientForm"><div class="formgrid"><div class="field"><label>Full name *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email)}"></div><div class="field"><label>Event / booking</label><input name="event" value="${esc(c.event)}"></div><div class="field full"><label>Address</label><textarea name="address">${esc(c.address)}</textarea></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div></form>`);$('#modalSave').onclick=()=>{const f=$('#clientForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(db.clients.some(x=>x.id!==id&&x.name.trim().toLowerCase()===d.name.trim().toLowerCase()&&d.name.trim())){if(!confirm('A client with this name already exists. Save anyway?'))return}if(id)Object.assign(c,d);else db.clients.push({id:uid('CL'),...d});save();closeModal();render()}}
function deleteClient(id){if(db.invoices.some(i=>i.clientId===id)){alert('This client is linked to an invoice. Edit or keep the client so your records remain connected.');return}if(confirm('Delete this client?')){db.clients=db.clients.filter(c=>c.id!==id);save();render()}}
function openPackage(id){const p=db.packages.find(x=>x.id===id)||{name:'',description:'',price:'',duration:'',notes:''};modal(id?'Edit package':'Add package',`<form id="packageForm"><div class="formgrid"><div class="field"><label>Package name *</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Price (GH₵) *</label><input name="price" type="number" min="0" step="0.01" required value="${esc(p.price)}"></div><div class="field full"><label>Description and deliverables</label><textarea name="description" placeholder="List what's included">${esc(p.description)}</textarea></div><div class="field"><label>Duration / coverage hours</label><input name="duration" value="${esc(p.duration)}"></div><div class="field"><label>Internal notes</label><input name="notes" value="${esc(p.notes)}"></div></div></form>`);$('#modalSave').onclick=()=>{const f=$('#packageForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));d.price=Number(d.price);if(id)Object.assign(p,d);else db.packages.push({id:uid('PK'),...d});save();closeModal();render()}}
function deletePackage(id){if(confirm('Delete this saved package? Existing invoices will not be changed.')){db.packages=db.packages.filter(p=>p.id!==id);save();render()}}
function openInvoice(id){if(!db.clients.length){if(confirm('Add a client before creating an invoice?'))openClient();return}const old=db.invoices.find(i=>i.id===id);const inv=old?JSON.parse(JSON.stringify(old)):{id:uid('INV'),number:numberInvoice(),date:today(),dueDate:'',clientId:db.clients[0].id,eventName:'',status:'unpaid',items:[{name:'',description:'',qty:1,price:0}],programmes:[],discount:0,charges:0,deposit:0,terms:settings().terms,notes:settings().notes};const clientOptions=db.clients.map(c=>`<option value="${c.id}" ${inv.clientId===c.id?'selected':''}>${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('');const body=`<form id="invoiceForm"><div class="notice">Invoice ${esc(inv.number)} · Each programme has its own date and location. Descriptions are saved separately from package names.</div><div class="formgrid"><div class="field"><label>Client *</label><select name="clientId" required>${clientOptions}</select></div><div class="field"><label>Booking / event name</label><input name="eventName" value="${esc(inv.eventName)}" placeholder="e.g. The Thompson Wedding"></div><div class="field"><label>Issue date *</label><input name="date" required value="${esc(inv.date)}" type="date"></div><div class="field"><label>Payment due date</label><input name="dueDate" value="${esc(inv.dueDate)}" type="date"></div><div class="field"><label>Status</label><select name="status">${['draft','unpaid','cancelled'].map(s=>`<option value="${s}" ${inv.status===s?'selected':''}>${s}</option>`).join('')}<option value="paid" ${status(inv)==='paid'?'selected':''}>paid (calculated from payments)</option></select></div><div class="field"><label>Deposit required (amount)</label><input name="deposit" type="number" min="0" step="0.01" value="${Number(inv.deposit||0)}"></div></div><div class="sectiontitle">Invoice items</div><div id="invoiceItems"></div><div style="margin:8px 0 20px">${btn('＋ Add custom item',"addItem()")}${db.packages.length?` <select id="packageSelect" style="padding:10px;border:1px solid var(--line);border-radius:8px;max-width:270px"><option value="">Add saved package…</option>${db.packages.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select> <button type="button" class="btn" onclick="addPackageItem()">Add package</button>`:''}</div><div class="formgrid"><div class="field"><label>Discount (amount)</label><input name="discount" type="number" min="0" step="0.01" value="${Number(inv.discount||0)}" oninput="updateTotals()"></div><div class="field"><label>Additional charges</label><input name="charges" type="number" min="0" step="0.01" value="${Number(inv.charges||0)}" oninput="updateTotals()"></div></div><div class="totals" id="invoiceTotals"></div><div class="sectiontitle">Event programmes & locations</div><p class="muted" style="font-size:12px">Add one entry for every part of the booking. Dates and locations are free-text fields, so you can enter them exactly as the client provides them.</p><div id="programmes"></div><div style="margin:8px 0 20px">${btn('＋ Add programme',"addProgramme()")}</div><div class="formgrid"><div class="field full"><label>Payment terms</label><textarea name="terms">${esc(inv.terms||'')}</textarea></div><div class="field full"><label>Additional notes</label><textarea name="notes">${esc(inv.notes||'')}</textarea></div></div></form>`;modal(id?'Edit invoice':'Create invoice',body,'Save invoice');window._invoiceDraft=inv;renderItems(inv.items||[]);renderProgrammes(inv.programmes||[]);updateTotals();$('#modalSave').onclick=()=>saveInvoice(id)}
function renderItems(items){$('#invoiceItems').innerHTML=items.map((i,n)=>itemHTML(i,n)).join('');updateTotals()}function itemHTML(i,n){return `<div class="lineitem" data-item="${n}"><div class="linehead"><strong>Item ${n+1}</strong><button type="button" class="btn small danger" onclick="removeItem(${n})">Remove item</button></div><div class="itemgrid"><div class="field"><label>Item / package name *</label><input data-k="name" required value="${esc(i.name)}" placeholder="Photography package"></div><div class="field"><label>Description</label><input data-k="description" value="${esc(i.description)}" placeholder="Deliverables"></div><div class="field"><label>Qty *</label><input data-k="qty" type="number" min="0.01" step="0.01" required value="${Number(i.qty)||1}"></div><div class="field"><label>Unit price *</label><input data-k="price" type="number" min="0" step="0.01" required value="${Number(i.price)||0}"></div><div class="field"><label>Line total</label><input value="${money((Number(i.qty)||0)*(Number(i.price)||0))}" disabled></div></div></div>`}function getItems(){return [...document.querySelectorAll('#invoiceItems .lineitem')].map(el=>{const o={};el.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);o.qty=Number(o.qty);o.price=Number(o.price);return o})}function addItem(){const items=getItems();items.push({name:'',description:'',qty:1,price:0});renderItems(items)}function removeItem(n){const a=getItems();if(a.length===1){alert('An invoice must have at least one item.');return}a.splice(n,1);renderItems(a)}function addPackageItem(){const id=$('#packageSelect')?.value;if(!id)return;const p=db.packages.find(x=>x.id===id);if(!p)return;const a=getItems();a.push({name:p.name,description:p.description,qty:1,price:Number(p.price)});renderItems(a);$('#packageSelect').value=''}function updateTotals(){if(!$('#invoiceTotals'))return;const items=getItems();const sub=items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);const d=Number($('#invoiceForm [name=discount]')?.value||0),ch=Number($('#invoiceForm [name=charges]')?.value||0),tot=Math.max(0,sub-d+ch);$('#invoiceTotals').innerHTML=`<div class="totalrow"><span>Subtotal</span><strong>${money(sub)}</strong></div><div class="totalrow"><span>Discount</span><strong>− ${money(d)}</strong></div><div class="totalrow"><span>Additional charges</span><strong>${money(ch)}</strong></div><div class="totalrow final"><span>Total</span><strong>${money(tot)}</strong></div>`;document.querySelectorAll('#invoiceItems .lineitem').forEach(el=>{const qty=Number(el.querySelector('[data-k=qty]').value)||0,price=Number(el.querySelector('[data-k=price]').value)||0;const input=el.querySelectorAll('input')[4];if(input)input.value=money(qty*price)})}$('#modalRoot').addEventListener('input',e=>{if(e.target.closest('#invoiceItems'))updateTotals()});
function renderProgrammes(programmes){$('#programmes').innerHTML=programmes.map((p,n)=>programmeHTML(p,n)).join('')}function programmeHTML(p,n){return `<div class="programme" data-programme="${n}"><div class="linehead"><strong>Programme ${n+1}</strong><button type="button" class="btn small danger" onclick="removeProgramme(${n})">Remove programme</button></div><div class="eventgrid"><div class="field"><label>Programme name</label><input data-p="name" value="${esc(p.name||'')}" placeholder="White wedding"></div><div class="field"><label>Event date (free text)</label><input data-p="date" value="${esc(p.date||'')}" placeholder="Saturday, 14 November 2026"></div><div class="field"><label>Event location (free text)</label><input data-p="location" value="${esc(p.location||'')}" placeholder="Venue, town / city"></div><div class="field"><label>Start time</label><input data-p="start" value="${esc(p.start||'')}" placeholder="9:00 AM"></div><div class="field"><label>End time / duration</label><input data-p="end" value="${esc(p.end||'')}" placeholder="e.g. 4:00 PM / 6 hours"></div><div class="field"><label>Full address</label><input data-p="address" value="${esc(p.address||'')}" placeholder="Optional full address"></div><div class="field"><label>Landmarks / directions</label><input data-p="directions" value="${esc(p.directions||'')}" placeholder="Optional directions"></div><div class="field full"><label>Special instructions</label><textarea data-p="instructions">${esc(p.instructions||'')}</textarea></div></div></div>`}function getProgrammes(){return [...document.querySelectorAll('#programmes .programme')].map(el=>{const o={};el.querySelectorAll('[data-p]').forEach(x=>o[x.dataset.p]=x.value.trim());return o}).filter(p=>Object.values(p).some(Boolean))}function addProgramme(){const a=getProgrammes();a.push({});renderProgrammes(a)}function removeProgramme(n){const a=getProgrammes();a.splice(n,1);renderProgrammes(a)}
function saveInvoice(id){const f=$('#invoiceForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));const items=getItems();if(!items.length||items.some(i=>!i.name.trim()||!Number.isFinite(i.qty)||i.qty<=0||!Number.isFinite(i.price)||i.price<0)){alert('Every invoice item needs a name, quantity greater than zero and a valid price.');return}d.discount=Number(d.discount||0);d.charges=Number(d.charges||0);d.deposit=Number(d.deposit||0);if(d.discount<0||d.charges<0||d.deposit<0){alert('Amounts cannot be negative.');return}const inv={...(window._invoiceDraft||{}),...d,items,programmes:getProgrammes(),updatedAt:new Date().toISOString()};if(!inv.programmes.length&&confirm('No event programmes have been added. Save invoice without programme details?')===false)return;if(id){const ix=db.invoices.findIndex(i=>i.id===id);if(ix>=0){inv.id=id;inv.number=db.invoices[ix].number;db.invoices[ix]=inv}}else{inv.createdAt=new Date().toISOString();db.invoices.push(inv)}save();closeModal();go('invoices')}
function editInvoice(id){openInvoice(id)}function deleteInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;if(db.payments.some(p=>p.invoiceId===id&&!p.reversed)){alert('This invoice has payment history. Cancel the invoice instead of deleting it, or reverse payments first.');return}if(confirm(`Delete invoice ${i.number}? This cannot be undone.`)){db.invoices=db.invoices.filter(x=>x.id!==id);save();render()}}
function openPayment(invoiceId){const eligible=db.invoices.filter(i=>!['draft','cancelled'].includes(status(i))&&balance(i)>0);if(!eligible.length){alert('There are no invoices with an outstanding balance. Create an invoice or check existing payments.');return}const selected=invoiceId||eligible[0].id;modal('Record a payment',`<form id="paymentForm"><div class="formgrid"><div class="field full"><label>Invoice *</label><select name="invoiceId" id="paymentInvoice" required>${eligible.map(i=>`<option value="${i.id}" ${i.id===selected?'selected':''}>${esc(i.number)} · ${esc(client(i.clientId).name)} · Balance ${money(balance(i))}</option>`).join('')}</select><small id="paymentBalance" class="muted"></small></div><div class="field"><label>Amount received *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Payment date *</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Payment method *</label><select name="method"><option>Mobile Money</option><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select></div><div class="field"><label>Transaction reference</label><input name="transactionRef" placeholder="Optional reference"></div><div class="field full"><label>Payment notes</label><textarea name="notes"></textarea></div></div></form>`,'Record & issue receipt');function updateBalance(){const i=db.invoices.find(x=>x.id===$('#paymentInvoice').value);$('#paymentBalance').textContent=i?`Outstanding balance: ${money(balance(i))}`:''}$('#paymentInvoice').onchange=updateBalance;updateBalance();$('#modalSave').onclick=()=>{const f=$('#paymentForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);const inv=db.invoices.find(i=>i.id===d.invoiceId);if(!inv||d.amount<=0){alert('Enter a valid payment amount.');return}if(d.amount>balance(inv)+0.005&&!confirm(`This payment is greater than the current balance (${money(balance(inv))}). Record it anyway?`))return;if(d.transactionRef&&db.payments.some(p=>!p.reversed&&p.transactionRef.trim()===d.transactionRef.trim())){alert('That transaction reference already exists. Check existing payments to avoid a duplicate.');return}const p={id:uid('PAY'),receiptNo:numberReceipt(),invoiceId:inv.id,clientId:inv.clientId,...d,createdAt:new Date().toISOString()};db.payments.push(p);save();closeModal();render();if(confirm(`Payment recorded as ${p.receiptNo}. Print this receipt now?`))printReceipt(p.id)}}
function reversePayment(id){const p=db.payments.find(x=>x.id===id);if(!p||p.reversed)return;if(confirm(`Reverse payment ${p.receiptNo} for ${money(p.amount)}? The record will be retained as reversed and the invoice balance recalculated.`)){p.reversed=true;p.reversedAt=new Date().toISOString();save();render()}}
function printInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i)return;const c=client(i.clientId),s=settings();const events=(i.programmes||[]).map(p=>{const fields=[['Event date',p.date],['Event location',p.location],['Start time',p.start],['End time / duration',p.end],['Full address',p.address],['Location notes',p.directions],['Special instructions',p.instructions]].filter(x=>x[1]);if(!p.name&&!fields.length)return '';return `<div class="eventprint"><h4>${esc(p.name||'Event programme')}</h4>${fields.map(([k,v])=>`<p><b>${k}:</b> ${esc(v)}</p>`).join('')}</div>`}).join('');const items=(i.items||[]).map(x=>`<tr><td><b>${esc(x.name)}</b>${x.description?`<div style="color:#606a72;font-size:11px;margin-top:3px">${esc(x.description)}</div>`:''}</td><td class="right">${Number(x.qty)||0}</td><td class="right">${money(x.price)}</td><td class="right">${money((Number(x.qty)||0)*(Number(x.price)||0))}</td></tr>`).join('');const html=docShell(`<div class="dochead"><img src="${esc(s.logo||'logo.jpg')}"/><div><div class="doclabel">INVOICE</div><h1>${esc(i.number)}</h1><p>Issue date: ${esc(fmtDate(i.date))}</p><p>${i.dueDate?`Due date: ${esc(fmtDate(i.dueDate))}`:''}</p><p>Status: ${esc(status(i))}</p></div></div><div class="twocol"><div><h3>From</h3><b>${esc(s.businessName)}</b><p>${esc(s.email)}</p><p>${esc(s.phone)}</p><p>${esc(s.address)}</p>${s.instagram?`<p>${esc(s.instagram)}</p>`:''}</div><div><h3>Bill to</h3><b>${esc(c.name)}</b><p>${esc(c.phone)}</p><p>${esc(c.email)}</p><p>${esc(c.address)}</p><p><b>Booking:</b> ${esc(i.eventName||c.event||'')}</p></div></div>${events?`<h2>Event programme schedule</h2>${events}`:''}<h2>Services</h2><table><thead><tr><th>Package / service</th><th class="right">Qty</th><th class="right">Unit price</th><th class="right">Amount</th></tr></thead><tbody>${items}</tbody></table><div class="doctotals"><p><span>Subtotal</span><b>${money(subtotal(i))}</b></p><p><span>Discount</span><b>− ${money(i.discount)}</b></p><p><span>Additional charges</span><b>${money(i.charges)}</b></p><p class="grand"><span>Total</span><b>${money(grand(i))}</b></p><p><span>Deposit required</span><b>${money(i.deposit)}</b></p><p><span>Paid to date</span><b>${money(paidFor(i.id))}</b></p><p class="grand"><span>Balance due</span><b>${money(balance(i))}</b></p></div>${i.terms?`<h3>Payment terms</h3><p>${esc(i.terms)}</p>`:''}${i.notes?`<h3>Notes</h3><p>${esc(i.notes)}</p>`:''}<div class="docfooter">Thank you for choosing ${esc(s.businessName)} · ${esc(s.email)} ${s.phone?'· '+esc(s.phone):''}</div>`);openPrint(html)}
function printReceipt(id){const p=db.payments.find(x=>x.id===id&&!x.reversed);if(!p){alert('A receipt can only be generated for a recorded, non-reversed payment.');return}const i=db.invoices.find(x=>x.id===p.invoiceId);if(!i){alert('The invoice linked to this payment could not be found.');return}const c=client(p.clientId),s=settings(),paid=db.payments.filter(x=>x.invoiceId===i.id&&!x.reversed&&new Date(x.createdAt||x.date)<=new Date(p.createdAt||p.date)).reduce((sum,x)=>sum+Number(x.amount||0),0),bal=Math.max(0,grand(i)-paid);const html=docShell(`<div class="dochead"><img src="${esc(s.logo||'logo.jpg')}"/><div><div class="receiptstamp">PAYMENT RECEIPT</div><h1>${esc(p.receiptNo)}</h1><p>Receipt date: ${esc(fmtDate(p.date))}</p></div></div><div class="twocol"><div><h3>Received by</h3><b>${esc(s.businessName)}</b><p>${esc(s.email)}</p><p>${esc(s.phone)}</p><p>${esc(s.address)}</p></div><div><h3>Payment from</h3><b>${esc(c.name)}</b><p>${esc(c.phone)}</p><p>${esc(c.email)}</p><p><b>Related invoice:</b> ${esc(i.number)}</p><p><b>Booking:</b> ${esc(i.eventName||c.event||'')}</p></div></div><div class="amountbox"><small>AMOUNT RECEIVED</small><h1>${money(p.amount)}</h1><p>Payment received and recorded</p></div><h2>Transaction details</h2><table><tbody><tr><th>Payment date</th><td>${esc(fmtDate(p.date))}</td></tr><tr><th>Payment method</th><td>${esc(p.method)}</td></tr>${p.transactionRef?`<tr><th>Transaction reference</th><td>${esc(p.transactionRef)}</td></tr>`:''}${p.notes?`<tr><th>Notes</th><td>${esc(p.notes)}</td></tr>`:''}</tbody></table><div class="doctotals"><p><span>Total invoice amount</span><b>${money(grand(i))}</b></p><p><span>Total paid to date</span><b>${money(paid)}</b></p><p class="grand"><span>Outstanding balance</span><b>${money(bal)}</b></p></div><p style="margin-top:25px">We acknowledge receipt of the payment shown above. Thank you for choosing ${esc(s.businessName)}.</p><div class="docfooter">${esc(s.businessName)} · ${esc(s.email)} ${s.phone?'· '+esc(s.phone):''}</div>`);openPrint(html)}
function docShell(content){return `<!doctype html><html><head><meta charset="utf-8"><title>Manuelclicks document</title><style>*{box-sizing:border-box}body{font:13px/1.5 Arial,sans-serif;color:#17212b;margin:0;padding:28px}h1{font-size:24px;margin:4px 0}h2{font-size:15px;margin:25px 0 9px;border-bottom:1px solid #dce3e7;padding-bottom:6px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#53616c;margin:0 0 8px}p{margin:3px 0}.dochead{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px solid #087eaa;padding-bottom:18px}.dochead img{max-width:48%;max-height:95px;object-fit:contain}.dochead>div{text-align:right}.doclabel{font-size:12px;letter-spacing:2px;color:#087eaa;font-weight:bold}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin:22px 0}.twocol>div{min-width:0}table{width:100%;border-collapse:collapse;margin:8px 0 15px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e3e9ed;vertical-align:top}thead th{background:#f1f7fa;font-size:10px;text-transform:uppercase;letter-spacing:.5px}.right{text-align:right}.eventprint{padding:10px 0;border-bottom:1px solid #ddd}.eventprint h4{margin:0 0 5px;font-size:13px}.eventprint p{margin:3px 0;font-size:12px}.doctotals{width:min(340px,100%);margin:18px 0 18px auto}.doctotals p{display:flex;justify-content:space-between;gap:15px;padding:5px 0}.doctotals .grand{font-size:15px;font-weight:bold;border-top:1px solid #9aa9b3;padding-top:10px}.docfooter{border-top:1px solid #dce3e7;margin-top:35px;padding-top:12px;color:#596873;font-size:11px}.amountbox{text-align:center;background:#eff8fb;border:1px solid #c9e6f0;padding:22px;margin:25px 0}.amountbox h1{font-size:30px;color:#075477}.amountbox small{letter-spacing:1px;font-weight:bold;color:#53616c}@page{size:A4;margin:14mm}@media(max-width:600px){body{padding:14px}.dochead img{max-width:45%}.twocol{gap:12px}}@media print{body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}h2,h3,.eventprint{break-after:avoid}tr{break-inside:avoid}.docfooter{break-inside:avoid}}</style></head><body>${content}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),250));<\/script></body></html>`}function openPrint(html){const w=window.open('','_blank');if(!w){alert('Your browser blocked the print window. Allow pop-ups for this app and try again.');return}w.document.open();w.document.write(html);w.document.close()}
function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});downloadBlob(blob,`manuelclicks-backup-${today()}.json`)}function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(){const rows=[['Invoice number','Issue date','Due date','Client','Event','Subtotal','Discount','Charges','Total','Paid','Balance','Status','Programmes']];db.invoices.forEach(i=>rows.push([i.number,i.date,i.dueDate,client(i.clientId).name,i.eventName,subtotal(i),i.discount,i.charges,grand(i),paidFor(i.id),balance(i),status(i),(i.programmes||[]).map(p=>`${p.name}: ${p.date} @ ${p.location}`).join(' | ')]));const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`manuelclicks-invoices-${today()}.csv`)}
function clearAll(){if(!confirm('This permanently removes all clients, packages, invoices, payments and settings from this browser. Export a JSON backup first. Continue?'))return;if(!confirm('Final confirmation: erase ALL Manuelclicks Invoice data on this device?'))return;localStorage.removeItem(KEY);db=structuredClone(defaults);save();go('dashboard')}
$('#view').addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();const f=e.target;const d=Object.fromEntries(new FormData(f));d.depositPercent=Math.min(100,Math.max(0,Number(d.depositPercent)||0));d.invoiceNext=Math.max(1,Number(d.invoiceNext)||1);d.receiptNext=Math.max(1,Number(d.receiptNext)||1);db.settings={...settings(),...d};const file=$('#logoUpload').files[0];if(file){const reader=new FileReader();reader.onload=()=>{db.settings.logo=reader.result;save();render();alert('Settings and logo saved.');};reader.onerror=()=>alert('Could not read logo file.');reader.readAsDataURL(file)}else{save();render();alert('Settings saved.')}}});$('#view').addEventListener('change',e=>{if(e.target.id==='restoreFile'&&e.target.files[0])restoreBackup(e.target.files[0])});function restoreBackup(file){const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.clients)||!Array.isArray(incoming.invoices)||!Array.isArray(incoming.payments)||!Array.isArray(incoming.packages)||!incoming.settings)throw Error('This file does not look like a valid Manuelclicks Invoice backup.');if(!confirm('Restore this backup? Current records will be replaced. Export a backup of current records first if you need to keep them.'))return;db={...structuredClone(defaults),...incoming,version:1,settings:{...defaults.settings,...incoming.settings}};save();go('dashboard');alert('Backup restored successfully.')}catch(e){alert('Restore failed: '+e.message)}finally{$('#restoreFile').value=''}};reader.onerror=()=>alert('Could not read backup file.');reader.readAsText(file)}
window.go=go;window.render=render;Object.defineProperty(window,'search',{get:()=>search,set:v=>{search=String(v||'')}});Object.defineProperty(window,'filter',{get:()=>filter,set:v=>{filter=String(v||'')}});window.saveInvoice=saveInvoice;window.openClient=openClient;window.openPackage=openPackage;window.openInvoice=openInvoice;window.editInvoice=editInvoice;window.deleteInvoice=deleteInvoice;window.deleteClient=deleteClient;window.deletePackage=deletePackage;window.printInvoice=printInvoice;window.openPayment=openPayment;window.printReceipt=printReceipt;window.reversePayment=reversePayment;window.exportBackup=exportBackup;window.exportCSV=exportCSV;window.clearAll=clearAll;window.closeModal=closeModal;window.addItem=addItem;window.removeItem=removeItem;window.addPackageItem=addPackageItem;window.addProgramme=addProgramme;window.removeProgramme=removeProgramme;window.updateTotals=updateTotals;search='';filter='all';render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
